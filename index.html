<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open pls 👀</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background-image: url("background.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
    position: relative;
}

/* soft overlay so text can be seen better */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 240, 246, 0.15);
    z-index: 0;
}

.card {
    position: relative;
    z-index: 1;
    text-align: center;
    width: 90%;
    max-width: 500px;
    padding: 20px;
}

.character-frame {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 170px;
    height: 170px;
    background: rgba(255, 255, 255, 0.15);
    border: 4px solid #ff99bd;
    border-radius: 22px;
    box-shadow: 0 10px 25px rgba(255, 79, 118, 0.25);
    margin-bottom: 22px;
    backdrop-filter: blur(2px);
}

.character {
    width: 135px;
    height: 135px;
    object-fit: contain;
    border-radius: 16px;
}

h1 {
    font-size: 32px;
    line-height: 1.15;
    color: #d6336c;
    text-shadow: 2px 2px 0 #fff;
    margin: 10px 0 24px;
}

.buttons {
    position: relative;
    width: 280px;
    height: 120px;
    margin: 0 auto;
}

button {
    border: 2px solid #d94b7b;
    padding: 12px 28px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.15s ease;
}

button:hover {
    transform: scale(1.05);
}

#yes {
    background: #ff4f85;
    color: white;
    position: absolute;
    left: 45px;
    top: 20px;
    box-shadow: 0 6px 14px rgba(255, 79, 133, 0.35);
}

#no {
    background: #ffe0ea;
    color: #9d2451;
    position: absolute;
    left: 155px;
    top: 20px;
}

/* popup screen */
.popup-bg {
    width: 100vw;
    height: 100vh;
    background: linear-gradient(180deg, #fff0f6 0%, #ffd9e8 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.popup {
    width: 90%;
    max-width: 380px;
    background: white;
    border-radius: 25px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(255, 79, 118, 0.2);
    animation: pop 0.4s ease;
}

.heart {
    font-size: 50px;
    animation: heartbeat 1s infinite;
}

.popup h1 {
    color: #ff4f76;
    margin-bottom: 5px;
    text-shadow: none;
}

.small {
    color: #888;
    margin-top: 8px;
    line-height: 1.4;
}

.mission {
    background: #fff5f7;
    border: 2px dashed #ff8fab;
    border-radius: 18px;
    padding: 18px;
    margin-top: 20px;
}

.mission p {
    color: #ff4f76;
    font-weight: bold;
    margin-top: 0;
}

.mission h2 {
    font-size: 22px;
    margin: 12px 0;
    color: #333;
    line-height: 1.3;
}

.date {
    display: inline-block;
    background: #ff4f76;
    color: white;
    padding: 10px 18px;
    border-radius: 20px;
    font-weight: bold;
    margin-top: 6px;
}

.warning {
    margin-top: 20px;
    font-weight: bold;
    color: #444;
}

.terms {
    margin-top: 10px;
    font-size: 12px;
    color: #999;
}

@keyframes pop {
    0% {
        transform: scale(0.6);
        opacity: 0;
    }
    80% {
        transform: scale(1.05);
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.15);
    }
}
</style>
</head>

<body>

<div class="card">
    <div class="character-frame">
        <img src="cute.gif" class="character" alt="Cute GIF">
    </div>

    <h1 id="question">Will you go out with me? 🥺</h1>

    <div class="buttons">
        <button id="yes">YES ❤️</button>
        <button id="no">No</button>
    </div>
</div>

<script>
const noButton = document.getElementById("no");
const yesButton = document.getElementById("yes");
const question = document.getElementById("question");

const messages = [
    "Are you sure? 🤨",
    "Really sure??",
    "Think again 😭",
    "Wrong answer.",
    "Better say yes 😤",
    "COME ON 😭"
];

let count = 0;

function moveNoButton() {
    if (count < messages.length) {
        question.innerText = messages[count];
        count++;
    }

    const maxX = window.innerWidth - noButton.offsetWidth - 20;
    const maxY = window.innerHeight - noButton.offsetHeight - 20;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noButton.style.position = "fixed";
    noButton.style.left = x + "px";
    noButton.style.top = y + "px";
    noButton.style.zIndex = "999";
}

noButton.addEventListener("mouseover", moveNoButton);
noButton.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveNoButton();
});

yesButton.addEventListener("click", () => {
    document.body.innerHTML = `
        <div class="popup-bg">
            <div class="popup">
                <div class="heart">🎉</div>

                <h1>Congratulations!</h1>

                <p class="small">
                    By clicking <b>YES</b>, you have officially agreed to:
                </p>

                <div class="mission">
                    <p>💗 YOUR AGREEMENT 💗</p>

                    <h2>
                        Pick me up at the<br>
                        bus station 🚌
                    </h2>

                    <div class="date">
                        14/8 • 12:00 AM
                    </div>
                </div>

                <p class="warning">
                    No cancellations allowed 😌💗
                </p>

                <p class="terms">
                    Terms & conditions accepted automatically ✓
                </p>
            </div>
        </div>
    `;
});
</script>

</body>
</html>
