<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Open pls 👀</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #fff5f7;
    overflow: hidden;
}

.card {
    text-align: center;
}

h1 {
    font-size: 28px;
}

.buttons {
    margin-top: 30px;
    position: relative;
    height: 150px;
}

button {
    border: none;
    padding: 14px 30px;
    font-size: 18px;
    border-radius: 12px;
    cursor: pointer;
}

#yes {
    background: #ff4f76;
    color: white;
}

#no {
    background: #ddd;
    position: absolute;
    margin-left: 15px;

.popup-bg {
    width: 100vw;
    height: 100vh;
    background: #fff0f5;
    display: flex;
    justify-content: center;
    align-items: center;
}

.popup {
    width: 85%;
    max-width: 350px;
    background: white;
    border-radius: 25px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(255, 79, 118, 0.2);
    animation: pop 0.4s ease;
}

.heart {
    font-size: 50px;
    animation: heartbeat 1s infinite;
}

.popup h1 {
    color: #ff4f76;
    margin-bottom: 5px;
}

.small {
    color: #888;
}

.mission {
    background: #fff5f7;
    border: 2px dashed #ff8fab;
    border-radius: 18px;
    padding: 18px;
    margin-top: 20px;
}

.mission p {
    color: #ff4f76;
    font-weight: bold;
}

.mission h2 {
    font-size: 21px;
    margin: 12px 0;
}

.date {
    display: inline-block;
    background: #ff4f76;
    color: white;
    padding: 10px 18px;
    border-radius: 20px;
    font-weight: bold;
}

.warning {
    margin-top: 20px;
    font-weight: bold;
}

@keyframes pop {
    0% {
        transform: scale(0.6);
        opacity: 0;
    }

    80% {
        transform: scale(1.05);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}
}
</style>
</head>

<body>

<div class="card">

    <h1 id="question">
        Will you go out with me? 🥺
    </h1>

    <div class="buttons">

        <button id="yes">
            YES ❤️
        </button>

        <button id="no">
            No
        </button>

    </div>

</div>


<script>

const noButton = document.getElementById("no");
const yesButton = document.getElementById("yes");
const question = document.getElementById("question");

const messages = [
    "Are you sure? 🤨",
    "Really sure??",
    "Think again 😭",
    "Wrong answer.",
    "Better say yes 😤",
    "COME ON 😭"
];

let count = 0;

function moveNoButton() {

    if (count < messages.length) {
        question.innerText = messages[count];
        count++;
    }

    const x =
        Math.random() * (window.innerWidth - 120);

    const y =
        Math.random() * (window.innerHeight - 60);

    noButton.style.position = "fixed";
    noButton.style.left = x + "px";
    noButton.style.top = y + "px";
}

noButton.addEventListener("mouseover", moveNoButton);
noButton.addEventListener("touchstart", moveNoButton);

yesButton.addEventListener("click", () => {
    document.body.innerHTML = `
        <div class="popup-bg">
            <div class="popup">
                <div class="heart">🎉</div>

                <h1>Congratulations!</h1>

                <p class="small">
                    By clicking <b>YES</b>, you have officially agreed to:
                </p>

                <div class="mission">
                    <p>💗 YOUR AGREEMENT 💗</p>

                    <h2>
                        Pick me up at the<br>
                        bus station 🚌
                    </h2>

                    <div class="date">
                        14/8 • 12:00 AM
                    </div>
                </div>

                <p class="warning">
                    No cancellations allowed 😌💗
                </p>
            </div>
        </div>
    `;
});

</script>

</body>
</html>
