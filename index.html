<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Open pls 👀</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #fff5f7;
    overflow: hidden;
}

.card {
    text-align: center;
}

h1 {
    font-size: 28px;
}

.buttons {
    margin-top: 30px;
    position: relative;
    height: 150px;
}

button {
    border: none;
    padding: 14px 30px;
    font-size: 18px;
    border-radius: 12px;
    cursor: pointer;
}

#yes {
    background: #ff4f76;
    color: white;
}

#no {
    background: #ddd;
    position: absolute;
    margin-left: 15px;
}
</style>
</head>

<body>

<div class="card">

    <h1 id="question">
        Will you go out with me? 🥺
    </h1>

    <div class="buttons">

        <button id="yes">
            YES ❤️
        </button>

        <button id="no">
            No
        </button>

    </div>

</div>


<script>

const noButton = document.getElementById("no");
const yesButton = document.getElementById("yes");
const question = document.getElementById("question");

const messages = [
    "Are you sure? 🤨",
    "Really sure??",
    "Think again 😭",
    "Wrong answer.",
    "Better say yes 😤",
    "COME ON 😭"
];

let count = 0;

function moveNoButton() {

    if (count < messages.length) {
        question.innerText = messages[count];
        count++;
    }

    const x =
        Math.random() * (window.innerWidth - 120);

    const y =
        Math.random() * (window.innerHeight - 60);

    noButton.style.position = "fixed";
    noButton.style.left = x + "px";
    noButton.style.top = y + "px";
}

noButton.addEventListener("mouseover", moveNoButton);
noButton.addEventListener("touchstart", moveNoButton);

yesButton.addEventListener("click", () => {
    document.body.innerHTML = `
        <div class="popup-bg">
            <div class="popup">
                <div class="heart">🎉</div>

                <h1>Congratulations!</h1>

                <p class="small">
                    By clicking <b>YES</b>, you have officially agreed to:
                </p>

                <div class="mission">
                    <p>💗 YOUR AGREEMENT 💗</p>

                    <h2>
                        Pick me up at the<br>
                        bus station 🚌
                    </h2>

                    <div class="date">
                        14/8 • 12:00 AM
                    </div>
                </div>

                <p class="warning">
                    No cancellations allowed 😌💗
                </p>
            </div>
        </div>
    `;
});

</script>

</body>
</html>
