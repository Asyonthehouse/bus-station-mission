<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Open pls 👀</title>


<!-- CUTE FONT -->
<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
rel="stylesheet">


<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}


body {
    margin: 0;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family:
        "Fredoka",
        Arial,
        sans-serif;

    background-image:
        url("background.jpg?v=5");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    overflow: hidden;

    position: relative;
}


/* LIGHT OVERLAY */

body::before {
    content: "";

    position: fixed;

    inset: 0;

    background:
        rgba(255,255,255,0.04);

    z-index: 0;

    pointer-events: none;
}



/* =========================
   MAIN CARD
========================= */

.card {
    position: relative;

    z-index: 2;

    text-align: center;

    width: 92%;
    max-width: 600px;

    padding: 20px;
}



/* =========================
   CHARACTER / GIF
========================= */

.character-frame {
    display: inline-flex;

    justify-content: center;
    align-items: center;

    width: 170px;
    height: 170px;

    border:
        4px solid
        #ff8fba;

    border-radius: 22px;

    background:
        rgba(255,255,255,0.15);

    box-shadow:
        0 10px 25px
        rgba(255,79,118,0.20);

    margin-bottom: 25px;
}


.character {
    width: 135px;
    height: 135px;

    object-fit: cover;

    border-radius: 15px;
}



/* =========================
   QUESTION
========================= */

h1 {
    font-size: 34px;

    font-weight: 600;

    color: #ee3976;

    letter-spacing: 0.3px;

    text-shadow:
        2px 2px 0px
        rgba(255,255,255,0.95);

    margin:
        5px 0 35px;
}



/* =========================
   BUTTON AREA
========================= */

.buttons {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 20px;

    width: 100%;
    height: 100px;

    position: relative;
}


button {
    min-width: 105px;

    border:
        2px solid
        #ee3976;

    padding:
        13px 28px;

    font-family:
        "Fredoka",
        Arial,
        sans-serif;

    font-size: 18px;

    font-weight: 600;

    border-radius: 14px;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}


button:hover {
    transform: scale(1.06);
}



/* YES */

#yes {
    background: #ff4380;

    color: white;

    box-shadow:
        0 7px 15px
        rgba(238,57,118,0.25);
}



/* NO */

#no {
    background: #ffe7f0;

    color: #aa174d;

    box-shadow:
        0 7px 15px
        rgba(238,57,118,0.10);
}



/* =========================
   POPUP SCREEN
========================= */

#popupScreen {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    justify-content: center;
    align-items: center;

    padding: 20px;

    overflow: hidden;

    /*
       This is the popup background.
       Person 1 + Person 2 sit ABOVE this,
       but BELOW the white popup card.
    */

    background:
        linear-gradient(
            180deg,
            rgba(255,241,246,0.76) 0%,
            rgba(255,215,231,0.76) 100%
        );

    backdrop-filter:
        blur(2px);
}



/* =========================
   PERSON 1
   BOTTOM RIGHT
========================= */

.floating-person {
    position: absolute;

    right: 40px;
    bottom: -10px;

    z-index: 1;

    pointer-events: none;

    animation:
        floatPerson
        3.5s
        ease-in-out
        infinite;
}


.floating-person img {
    width:
        clamp(
            280px,
            32vw,
            470px
        );

    max-height: 66vh;

    object-fit: contain;

    opacity: 0.96;

    filter:
        drop-shadow(
            0 15px 25px
            rgba(0,0,0,0.18)
        );
}



/* =========================
   PERSON 2
   TOP LEFT
========================= */

.floating-person-2 {
    position: absolute;

    left: 35px;
    top: 35px;

    z-index: 1;

    pointer-events: none;

    animation:
        floatPerson2
        4s
        ease-in-out
        infinite;
}


.floating-person-2 img {
    width:
        clamp(
            230px,
            26vw,
            390px
        );

    max-height: 50vh;

    object-fit: contain;

    opacity: 0.96;

    filter:
        drop-shadow(
            0 15px 25px
            rgba(0,0,0,0.16)
        );
}



/* =========================
   POPUP CARD
   ABOVE BOTH PEOPLE
========================= */

.popup {
    position: relative;

    z-index: 2;

    width: 90%;

    max-width: 390px;

    background:
        rgba(255,255,255,0.96);

    border-radius: 28px;

    padding:
        38px 25px 28px;

    text-align: center;

    box-shadow:
        0 15px 45px
        rgba(255,79,118,0.20);

    animation:
        pop 0.4s ease;
}


.heart {
    font-size: 55px;

    animation:
        heartbeat
        1s
        infinite;
}


.popup h1 {
    color: #ff4380;

    font-size: 32px;

    margin:
        10px 0 8px;

    text-shadow: none;
}


.small {
    color: #777;

    font-size: 16px;

    line-height: 1.5;

    margin-top: 5px;
}



/* =========================
   AGREEMENT BOX
========================= */

.mission {
    background: #fff4f8;

    border:
        2px dashed
        #ff8faf;

    border-radius: 20px;

    padding: 20px;

    margin-top: 22px;
}


.mission p {
    color: #ff4380;

    font-weight: 600;

    margin-top: 0;
}


.mission h2 {
    font-size: 22px;

    font-weight: 600;

    color: #333;

    line-height: 1.35;

    margin:
        12px 0;
}



/* =========================
   DATE
========================= */

.date {
    display: inline-block;

    background: #ff4380;

    color: white;

    padding:
        11px 20px;

    border-radius: 100px;

    font-size: 17px;

    font-weight: 600;

    margin-top: 8px;
}



/* =========================
   WARNING
========================= */

.warning {
    margin-top: 22px;

    color: #444;

    font-weight: 600;
}


.terms {
    margin-top: 10px;

    font-size: 12px;

    color: #aaa;
}



/* =========================
   RETURN BUTTON
========================= */

.return-btn {
    margin-top: 15px;

    background: white;

    color: #ee3976;

    border:
        2px solid
        #ff8faf;

    padding:
        10px 22px;

    font-size: 15px;

    border-radius: 100px;

    min-width: 0;

    box-shadow:
        0 5px 15px
        rgba(238,57,118,0.10);
}


.return-btn:hover {
    background: #fff3f7;
}



/* =========================
   MUSIC BUTTON
========================= */

.music-indicator {
    position: fixed;

    bottom: 22px;
    right: 22px;

    z-index: 2000;

    background: #ff4380;

    color: white;

    padding:
        13px 20px;

    border:
        3px solid white;

    border-radius: 100px;

    font-size: 16px;

    font-weight: 600;

    box-shadow:
        0 6px 18px
        rgba(0,0,0,0.15);

    backdrop-filter:
        blur(8px);

    cursor: pointer;

    transition:
        transform 0.15s ease,
        background 0.15s ease;
}


.music-indicator:hover {
    transform: scale(1.05);

    background: #ff5b91;
}



/* =========================
   POPUP ANIMATION
========================= */

@keyframes pop {

    0% {
        transform:
            scale(0.6);

        opacity: 0;
    }


    80% {
        transform:
            scale(1.05);
    }


    100% {
        transform:
            scale(1);

        opacity: 1;
    }

}



/* =========================
   HEART ANIMATION
========================= */

@keyframes heartbeat {

    0%,
    100% {
        transform:
            scale(1);
    }


    50% {
        transform:
            scale(1.15);
    }

}



/* =========================
   PERSON 1 FLOAT
========================= */

@keyframes floatPerson {

    0%,
    100% {
        transform:
            translateY(0px)
            rotate(-1deg);
    }


    50% {
        transform:
            translateY(-18px)
            rotate(1deg);
    }

}



/* =========================
   PERSON 2 FLOAT
========================= */

@keyframes floatPerson2 {

    0%,
    100% {
        transform:
            translateY(0px)
            rotate(1deg);
    }


    50% {
        transform:
            translateY(-14px)
            rotate(-1deg);
    }

}



/* =========================
   MOBILE
========================= */

@media
(max-width: 500px) {


    .character-frame {
        width: 145px;
        height: 145px;
    }


    .character {
        width: 115px;
        height: 115px;
    }


    h1 {
        font-size: 28px;

        margin-bottom: 28px;
    }


    .buttons {
        gap: 16px;
    }


    button {
        min-width: 95px;

        padding:
            12px 22px;

        font-size: 17px;
    }



    /* =====================
       PERSON 1 MOBILE
       BOTTOM RIGHT
    ===================== */

    .floating-person {
        right: -30px;

        bottom: 5px;
    }


    .floating-person img {
        width: 240px;

        max-height: 42vh;

        opacity: 0.94;
    }



    /* =====================
       PERSON 2 MOBILE
       TOP LEFT
    ===================== */

    .floating-person-2 {
        left: -20px;

        top: 25px;
    }


    .floating-person-2 img {
        width: 175px;

        max-height: 30vh;

        opacity: 0.94;
    }



    /* MUSIC MOBILE */

    .music-indicator {
        right: 15px;

        bottom: 15px;

        font-size: 15px;

        padding:
            12px 17px;
    }

}

</style>

</head>



<body>


<!-- =========================
     MUSIC
========================= -->

<audio
id="bgMusic"
src="song.mp3"
loop
preload="auto">
</audio>



<!-- =========================
     MAIN SCREEN
========================= -->

<div
class="card"
id="mainScreen">


    <div
    class="character-frame">


        <img
        src="cute.gif"
        class="character"
        alt="Cute GIF">


    </div>



    <h1
    id="question">

        Will you go out with me? 🥺

    </h1>



    <div
    class="buttons">


        <button
        id="yes">

            YES 💗

        </button>


        <button
        id="no">

            No

        </button>


    </div>


</div>



<!-- =========================
     YES POPUP
========================= -->

<div id="popupScreen">


    <!-- =====================
         PERSON 2
         TOP LEFT
         BETWEEN BACKGROUND
         AND POPUP
    ====================== -->

    <div class="floating-person-2">

        <img
        src="person2.png?v=2"
        alt="Person 2">

    </div>



    <!-- =====================
         PERSON 1
         BOTTOM RIGHT
         BETWEEN BACKGROUND
         AND POPUP
    ====================== -->

    <div class="floating-person">

        <img
        src="person.png?v=3"
        alt="Person 1">

    </div>



    <!-- =====================
         WHITE POPUP CARD
         ABOVE BOTH IMAGES
    ====================== -->

    <div class="popup">


        <div class="heart">

            🎉

        </div>



        <h1>

            Congratulations!

        </h1>



        <p class="small">

            By clicking

            <b>YES</b>,

            you have officially
            agreed to:

        </p>



        <div class="mission">


            <p>

                💗 YOUR AGREEMENT 💗

            </p>



            <h2>

                Pick me up at the

                <br>

                bus station 🚌

            </h2>



            <div class="date">

                14/8 • 12:00 AM

            </div>


        </div>



        <p class="warning">

            No cancellations
            allowed 😌💗

        </p>



        <p class="terms">

            Terms & conditions
            accepted automatically ✓

        </p>



        <button
        class="return-btn"
        id="returnButton">

            ← Return

        </button>


    </div>


</div>



<!-- =========================
     MUSIC BUTTON
========================= -->

<div
class="music-indicator"
id="musicButton">

    🎵 Music

</div>



<script>


/* =========================
   VARIABLES
========================= */

const noButton =
document.getElementById("no");


const yesButton =
document.getElementById("yes");


const question =
document.getElementById("question");


const mainScreen =
document.getElementById("mainScreen");


const popupScreen =
document.getElementById("popupScreen");


const returnButton =
document.getElementById("returnButton");


const music =
document.getElementById("bgMusic");


const musicButton =
document.getElementById("musicButton");



/* =========================
   MUSIC
========================= */

music.volume = 0.45;


let musicStarted = false;



function startMusic() {


    if (musicStarted) {

        return;

    }


    music.play()

    .then(() => {


        musicStarted = true;


        musicButton.innerText =
            "🎵 Aziz Playing";


    })


    .catch(() => {


        musicButton.innerText =
            "🎵 Tap for music";


    });

}



/* TRY AUTOPLAY */

window.addEventListener(

"load",

() => {


    startMusic();


}

);



/* PLAY AFTER FIRST INTERACTION */

document.addEventListener(

"pointerdown",

startMusic,

{ once: true }

);



document.addEventListener(

"keydown",

startMusic,

{ once: true }

);



/* =========================
   MUSIC TOGGLE
========================= */

musicButton.addEventListener(

"click",

() => {


    if (music.paused) {


        music.play();


        musicStarted = true;


        musicButton.innerText =
            "🎵 Music Playing";


    }

    else {


        music.pause();


        musicStarted = false;


        musicButton.innerText =
            "🔇 Music OFF";


    }


}

);



/* =========================
   NO BUTTON MESSAGES
========================= */

const messages = [

    "Are you sure? Syg 🥺",

    "Really sure?? 😭",

    "Think again... 🥹",

    "Wrong answer 😔",

    "Pleaseee bb 😭",

    "COME ONNN BB 😭💗"

];


let count = 0;



/* =========================
   MOVE NO BUTTON
========================= */

function moveNoButton() {


    if (

        count
        <
        messages.length

    ) {


        question.innerText =
            messages[count];


        count++;


    }



    const padding = 20;



    const maxX =

        window.innerWidth

        -

        noButton.offsetWidth

        -

        padding;



    const maxY =

        window.innerHeight

        -

        noButton.offsetHeight

        -

        padding;



    const x =

        Math.max(

            padding,

            Math.random()
            *
            maxX

        );



    const y =

        Math.max(

            padding,

            Math.random()
            *
            maxY

        );



    noButton.style.position =
        "fixed";


    noButton.style.left =
        x + "px";


    noButton.style.top =
        y + "px";


    noButton.style.zIndex =
        "999";

}



/* DESKTOP */

noButton.addEventListener(

"mouseover",

moveNoButton

);



/* MOBILE */

noButton.addEventListener(

"touchstart",

function(e) {


    e.preventDefault();


    startMusic();


    moveNoButton();


}

);



/* =========================
   YES BUTTON
========================= */

yesButton.addEventListener(

"click",

() => {


    startMusic();


    mainScreen.style.display =
        "none";


    popupScreen.style.display =
        "flex";


}

);



/* =========================
   RETURN BUTTON
========================= */

returnButton.addEventListener(

"click",

() => {


    popupScreen.style.display =
        "none";


    mainScreen.style.display =
        "block";


    /* RESET QUESTION */

    question.innerText =
        "Will you go out with me? 🥺";


    count = 0;


    /* RESET NO BUTTON */

    noButton.style.position =
        "";


    noButton.style.left =
        "";


    noButton.style.top =
        "";


    noButton.style.zIndex =
        "";


}

);


</script>


</body>

</html>
