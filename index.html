<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Open pls 👀</title>


<!-- CUTE FONT -->
<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
rel="stylesheet">


<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family:
    "Fredoka",
    Arial,
    sans-serif;

    background-image:
    url("background.jpg?v=5");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    overflow: hidden;

    position: relative;

}


/* LIGHT OVERLAY */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    background:
    rgba(255,255,255,0.04);

    z-index: 0;

    pointer-events: none;

}



/* =========================
   MAIN CARD
========================= */

.card {

    position: relative;

    z-index: 1;

    text-align: center;

    width: 92%;

    max-width: 600px;

    padding: 20px;

}



/* =========================
   CHARACTER / GIF
========================= */

.character-frame {

    display: inline-flex;

    justify-content: center;

    align-items: center;

    width: 170px;

    height: 170px;

    border:

    4px solid
    #ff8fba;

    border-radius: 22px;

    background:
    rgba(255,255,255,0.15);

    box-shadow:

    0 10px 25px
    rgba(255,79,118,0.20);

    margin-bottom: 25px;

}


.character {

    width: 135px;

    height: 135px;

    object-fit: cover;

    border-radius: 15px;

}



/* =========================
   QUESTION
========================= */

h1 {

    font-size: 34px;

    font-weight: 600;

    color: #ee3976;

    letter-spacing: 0.3px;

    text-shadow:

    2px 2px 0px
    rgba(255,255,255,0.95);

    margin:

    5px 0 35px;

}



/* =========================
   BUTTON AREA
========================= */

.buttons {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 20px;

    width: 100%;

    height: 100px;

    position: relative;

}


button {

    min-width: 105px;

    border:

    2px solid
    #ee3976;

    padding:

    13px 28px;

    font-family:

    "Fredoka",
    Arial,
    sans-serif;

    font-size: 18px;

    font-weight: 600;

    border-radius: 14px;

    cursor: pointer;

    transition:

    transform 0.15s ease,

    box-shadow 0.15s ease;

}


button:hover {

    transform: scale(1.06);

}



/* YES */

#yes {

    background: #ff4380;

    color: white;

    box-shadow:

    0 7px 15px
    rgba(238,57,118,0.25);

}



/* NO */

#no {

    background: #ffe7f0;

    color: #aa174d;

    box-shadow:

    0 7px 15px
    rgba(238,57,118,0.10);

}



/* =========================
   POPUP SCREEN
========================= */

#popupScreen {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    justify-content: center;

    align-items: center;

    padding: 20px;

    background:

    linear-gradient(

    180deg,

    #fff1f6 0%,

    #ffd7e7 100%

    );

}


.popup {

    width: 90%;

    max-width: 390px;

    background: white;

    border-radius: 28px;

    padding:

    38px 25px 28px;

    text-align: center;

    box-shadow:

    0 15px 45px
    rgba(255,79,118,0.20);

    animation:

    pop 0.4s ease;

}



.heart {

    font-size: 55px;

    animation:

    heartbeat 1s infinite;

}



.popup h1 {

    color: #ff4380;

    font-size: 32px;

    margin:

    10px 0 8px;

    text-shadow: none;

}



.small {

    color: #777;

    font-size: 16px;

    line-height: 1.5;

    margin-top: 5px;

}



/* =========================
   AGREEMENT BOX
========================= */

.mission {

    background: #fff4f8;

    border:

    2px dashed
    #ff8faf;

    border-radius: 20px;

    padding: 20px;

    margin-top: 22px;

}


.mission p {

    color: #ff4380;

    font-weight: 600;

    margin-top: 0;

}


.mission h2 {

    font-size: 22px;

    font-weight: 600;

    color: #333;

    line-height: 1.35;

    margin:

    12px 0;

}



/* DATE */

.date {

    display: inline-block;

    background: #ff4380;

    color: white;

    padding:

    11px 20px;

    border-radius: 100px;

    font-size: 17px;

    font-weight: 600;

    margin-top: 8px;

}



/* WARNING */

.warning {

    margin-top: 22px;

    color: #444;

    font-weight: 600;

}



.terms {

    margin-top: 10px;

    font-size: 12px;

    color: #aaa;

}



/* =========================
   RETURN BUTTON
========================= */

.return-btn {

    margin-top: 15px;

    background: white;

    color: #ee3976;

    border:

    2px solid
    #ff8faf;

    padding:

    10px 22px;

    font-size: 15px;

    border-radius: 100px;

    min-width: 0;

    box-shadow:

    0 5px 15px
    rgba(238,57,118,0.10);

}


.return-btn:hover {

    background: #fff3f7;

}



/* =========================
   MUSIC INDICATOR
========================= */

.music-indicator {
    position: fixed;
    bottom: 22px;
    right: 22px;

    z-index: 2000;

    background: #ff4380;
    color: white;

    padding: 13px 20px;

    border: 3px solid white;
    border-radius: 100px;

    font-size: 16px;
    font-weight: 600;

    box-shadow:
        0 6px 18px rgba(0,0,0,0.15);

    backdrop-filter: blur(8px);

    cursor: pointer;

    transition:
        transform 0.15s ease,
        background 0.15s ease;
}

.music-indicator:hover {
    transform: scale(1.05);
    background: white;
}



/* =========================
   ANIMATIONS
========================= */

@keyframes pop {

    0% {

        transform:
        scale(0.6);

        opacity: 0;

    }


    80% {

        transform:
        scale(1.05);

    }


    100% {

        transform:
        scale(1);

        opacity: 1;

    }

}



@keyframes heartbeat {

    0%,
    100% {

        transform:
        scale(1);

    }


    50% {

        transform:
        scale(1.15);

    }

}



/* =========================
   MOBILE
========================= */

@media
(max-width: 500px) {


    .character-frame {

        width: 145px;

        height: 145px;

    }


    .character {

        width: 115px;

        height: 115px;

    }


    h1 {

        font-size: 28px;

        margin-bottom: 28px;

    }


    .buttons {

        gap: 16px;

    }


    button {

        min-width: 95px;

        padding:

        12px 22px;

        font-size: 17px;

    }


}

</style>

</head>



<body>


<!-- =========================
     MUSIC
========================= -->

<audio
id="bgMusic"
src="song.mp3"
loop
preload="auto">
</audio>



<!-- =========================
     MAIN SCREEN
========================= -->

<div
class="card"
id="mainScreen">


    <div
    class="character-frame">


        <img

        src="cute.gif"

        class="character"

        alt="Cute GIF">


    </div>



    <h1
    id="question">

        Will you go out with me? 🥺

    </h1>



    <div
    class="buttons">


        <button
        id="yes">

            YES 💗

        </button>


        <button
        id="no">

            No

        </button>


    </div>


</div>



<!-- =========================
     YES POPUP
========================= -->

<div
id="popupScreen">


    <div
    class="popup">


        <div
        class="heart">

            🎉

        </div>



        <h1>

            Congratulations!

        </h1>



        <p
        class="small">

            By clicking

            <b>YES</b>,

            you have officially
            agreed to:

        </p>



        <div
        class="mission">


            <p>

                💗 YOUR AGREEMENT 💗

            </p>



            <h2>

                Pick me up at the

                <br>

                bus station 🚌

            </h2>



            <div
            class="date">

                14/8 • 12:00 AM

            </div>


        </div>



        <p
        class="warning">

            No cancellations
            allowed 😌💗

        </p>



        <p
        class="terms">

            Terms & conditions
            accepted automatically ✓

        </p>



        <button
        class="return-btn"
        id="returnButton">

            ← Return

        </button>


    </div>


</div>



<!-- MUSIC BUTTON -->

<div
class="music-indicator"
id="musicButton">

    🎵 Music

</div>



<script>


/* =========================
   VARIABLES
========================= */

const noButton =
document.getElementById("no");


const yesButton =
document.getElementById("yes");


const question =
document.getElementById("question");


const mainScreen =
document.getElementById("mainScreen");


const popupScreen =
document.getElementById("popupScreen");


const returnButton =
document.getElementById("returnButton");


const music =
document.getElementById("bgMusic");


const musicButton =
document.getElementById("musicButton");



/* =========================
   MUSIC
========================= */

music.volume = 0.45;


let musicStarted = false;



function startMusic() {


    if (musicStarted) {

        return;

    }


    music.play()

    .then(() => {

        musicStarted = true;

        musicButton.innerText =
        "🎵 Aziz Playing";

    })

    .catch(() => {

        musicButton.innerText =
        "🎵 Tap for music";

    });

}



/* TRY AUTOPLAY */

window.addEventListener(

"load",

() => {

    startMusic();

}

);



/* IF AUTOPLAY IS BLOCKED,
   START AFTER FIRST INTERACTION */

document.addEventListener(

"pointerdown",

startMusic,

{ once: true }

);



document.addEventListener(

"keydown",

startMusic,

{ once: true }

);



/* MUSIC TOGGLE */

musicButton.addEventListener(

"click",

() => {


    if (music.paused) {


        music.play();

        musicStarted = true;

        musicButton.innerText =
        "🎵 Music Playing";


    }

    else {


        music.pause();

        musicStarted = false;

        musicButton.innerText =
        "🔇 Music OFF";


    }


}

);



/* =========================
   NO BUTTON
========================= */

const messages = [

    "Are you sure? Syg 🥺",

    "Really sure?? 😭",

    "Think again... 🥹",

    "Wrong answer 😔",

    "Pleaseee bb 😭",

    "COME ONNN BB 😭💗"

];


let count = 0;



function moveNoButton() {


    if (

        count
        <
        messages.length

    ) {


        question.innerText =
        messages[count];


        count++;

    }



    const padding = 20;



    const maxX =

    window.innerWidth

    -

    noButton.offsetWidth

    -

    padding;



    const maxY =

    window.innerHeight

    -

    noButton.offsetHeight

    -

    padding;



    const x =

    Math.max(

        padding,

        Math.random()
        *
        maxX

    );



    const y =

    Math.max(

        padding,

        Math.random()
        *
        maxY

    );



    noButton.style.position =
    "fixed";


    noButton.style.left =
    x + "px";


    noButton.style.top =
    y + "px";


    noButton.style.zIndex =
    "999";

}



/* DESKTOP */

noButton.addEventListener(

"mouseover",

moveNoButton

);



/* MOBILE */

noButton.addEventListener(

"touchstart",

function(e) {


    e.preventDefault();


    startMusic();


    moveNoButton();


}

);



/* =========================
   YES BUTTON
========================= */

yesButton.addEventListener(

"click",

() => {


    startMusic();


    mainScreen.style.display =
    "none";


    popupScreen.style.display =
    "flex";


}

);



/* =========================
   RETURN BUTTON
========================= */

returnButton.addEventListener(

"click",

() => {


    popupScreen.style.display =
    "none";


    mainScreen.style.display =
    "block";


    /* RESET QUESTION */

    question.innerText =
    "Will you go out with me? 🥺";


    count = 0;


    /* PUT NO BUTTON BACK */

    noButton.style.position =
    "";


    noButton.style.left =
    "";


    noButton.style.top =
    "";


    noButton.style.zIndex =
    "";


}

);


</script>


</body>

</html>
